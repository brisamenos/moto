<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
  header h1 { font-size: 18px; color: #e94560; }
  #status { font-size: 12px; color: #888; }
  #status.online { color: #4caf50; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #0f3460; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.assistant { background: #16213e; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #0f3460; }
  .msg.assistant.thinking { color: #888; font-style: italic; }
  .file-tag { display: inline-block; background: #0f3460; border: 1px solid #e94560; border-radius: 6px; padding: 2px 8px; font-size: 12px; margin: 4px 4px 4px 0; color: #e94560; }
  #attached-files { padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 6px; background: #16213e; border-top: 1px solid #0f3460; min-height: 0; }
  #attached-files:empty { display: none; }
  .attached-tag { background: #0f3460; border: 1px solid #e94560; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #e94560; display: flex; align-items: center; gap: 6px; }
  .attached-tag button { background: none; border: none; color: #e94560; cursor: pointer; font-size: 14px; line-height: 1; }
  #input-area { background: #16213e; padding: 12px 20px; border-top: 1px solid #0f3460; display: flex; gap: 10px; align-items: flex-end; }
  #msg-input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 10px; padding: 10px 14px; color: #e0e0e0; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; outline: none; }
  #msg-input:focus { border-color: #e94560; }
  button.send { background: #e94560; border: none; border-radius: 10px; padding: 10px 18px; color: white; font-size: 14px; cursor: pointer; white-space: nowrap; }
  button.send:hover { background: #c73652; }
  button.send:disabled { background: #555; cursor: not-allowed; }
  label.attach { background: #0f3460; border: 1px solid #0f3460; border-radius: 10px; padding: 10px 14px; color: #e0e0e0; font-size: 14px; cursor: pointer; white-space: nowrap; }
  label.attach:hover { border-color: #e94560; color: #e94560; }
  #file-input { display: none; }
  #model-info { font-size: 11px; color: #555; text-align: center; padding: 4px; }
  code { background: #0f3460; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Ollama Chat</h1>
  <span id="status">Verificando conexão...</span>
</header>

<div id="messages">
  <div class="msg assistant">Olá! Sou o <strong>gemma4:e2b</strong> rodando na sua VPS. Pode me enviar mensagens e anexar arquivos para eu analisar.</div>
</div>

<div id="attached-files"></div>

<div id="input-area">
  <label class="attach" for="file-input">+ Arquivo</label>
  <input type="file" id="file-input" multiple accept=".txt,.js,.ts,.py,.html,.css,.json,.md,.csv,.jsx,.tsx,.php,.java,.c,.cpp,.sql">
  <textarea id="msg-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
  <button class="send" id="send-btn" onclick="sendMessage()">Enviar</button>
</div>
<div id="model-info">gemma4:e2b @ http://45.79.213.38:11434</div>

<script>
const API = 'http://45.79.213.38:11434';
const MODEL = 'gemma4:e2b';
let attachedFiles = [];
let history = [];

async function checkStatus() {
  try {
    const r = await fetch(API + '/api/tags');
    if (r.ok) {
      document.getElementById('status').textContent = 'Conectado';
      document.getElementById('status').className = 'online';
    }
  } catch(e) {
    document.getElementById('status').textContent = 'Sem conexão';
  }
}
checkStatus();

document.getElementById('file-input').addEventListener('change', async function() {
  for (const file of this.files) {
    const text = await file.text();
    attachedFiles.push({ name: file.name, content: text });
    renderAttached();
  }
  this.value = '';
});

function renderAttached() {
  const el = document.getElementById('attached-files');
  el.innerHTML = '';
  attachedFiles.forEach((f, i) => {
    const tag = document.createElement('div');
    tag.className = 'attached-tag';
    tag.innerHTML = `${f.name} <button onclick="removeFile(${i})">×</button>`;
    el.appendChild(tag);
  });
}

function removeFile(i) {
  attachedFiles.splice(i, 1);
  renderAttached();
}

document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return div;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  let fullMessage = text;
  if (attachedFiles.length > 0) {
    fullMessage += '\n\n';
    attachedFiles.forEach(f => {
      fullMessage += `--- Arquivo: ${f.name} ---\n${f.content}\n\n`;
    });
  }

  const fileNames = attachedFiles.map(f => f.name);
  const userDiv = addMessage('user', text + (fileNames.length ? '\n' + fileNames.map(n => `[${n}]`).join(' ') : ''));
  
  history.push({ role: 'user', content: fullMessage });
  input.value = '';
  attachedFiles = [];
  renderAttached();

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  const assistantDiv = addMessage('assistant thinking', 'Pensando...');

  try {
    const response = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        stream: true
      })
    });

    assistantDiv.textContent = '';
    assistantDiv.className = 'msg assistant';
    let fullReply = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n').filter(l => l.trim());
      for (const line of lines) {
        try {
          const data = JSON.parse(line);
          if (data.message?.content) {
            fullReply += data.message.content;
            assistantDiv.textContent = fullReply;
            assistantDiv.scrollIntoView({ behavior: 'smooth' });
          }
        } catch(e) {}
      }
    }

    history.push({ role: 'assistant', content: fullReply });
  } catch(e) {
    assistantDiv.textContent = 'Erro ao conectar na VPS. Verifique se o Ollama está rodando.';
    assistantDiv.className = 'msg assistant';
  }

  btn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
